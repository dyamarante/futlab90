<body>
<div id="page"></div>
<script>
(async()=>{
  const base='/jogadores/lorran/';
  const files=['fragment-1.html','fragment-2.html','fragment-3.html','fragment-4.html'];
  const parts=await Promise.all(files.map(f=>fetch(base+f).then(r=>{if(!r.ok)throw new Error(`Falha ao carregar ${f}`);return r.text()})));
  document.getElementById('page').outerHTML=parts.join('');
  const s=document.createElement('script');s.src=base+'app.js';document.body.appendChild(s);
})().catch(err=>{document.getElementById('page').innerHTML='<main style="max-width:800px;margin:80px auto;padding:24px;font-family:system-ui"><h1>FutLab 90</h1><p>Não foi possível carregar o estudo agora.</p></main>';console.error(err)});
</script>
</body>
</html>
